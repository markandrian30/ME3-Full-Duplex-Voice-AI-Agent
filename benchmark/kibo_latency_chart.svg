<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>Kibo latency on the Raspberry Pi: mean and p95 per stage, with targets</title>
  <rect width="1200" height="600" fill="#fcfcfb"/>

  <text x="40" y="44" font-size="26" font-weight="600" fill="#0b0b0b">Kibo latency on the Pi (seconds)</text>
  <text x="40" y="72" font-size="16" fill="#52514e">Mean and p95 from 20 live sessions, 6 Nov 2026</text>

  <!-- legend -->
  <rect x="760" y="30" width="18" height="14" rx="3" fill="#2a78d6"/>
  <text x="786" y="42" font-size="16" fill="#52514e">Mean</text>
  <rect x="850" y="30" width="18" height="14" rx="3" fill="#9ec5f4"/>
  <text x="876" y="42" font-size="16" fill="#52514e">p95</text>
  <rect x="932" y="26" width="3" height="22" fill="#0b0b0b"/>
  <text x="944" y="42" font-size="16" fill="#52514e">Target</text>

  <!-- gridlines: 0..10 s, 82.73 px per second, plot starts at x=240 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="405.5" y1="96" x2="405.5" y2="530"/>
    <line x1="570.9" y1="96" x2="570.9" y2="530"/>
    <line x1="736.4" y1="96" x2="736.4" y2="530"/>
    <line x1="901.8" y1="96" x2="901.8" y2="530"/>
    <line x1="1067.3" y1="96" x2="1067.3" y2="530"/>
  </g>
  <line x1="240" y1="96" x2="240" y2="530" stroke="#c3c2b7" stroke-width="1"/>
  <g font-size="14" fill="#898781" text-anchor="middle">
    <text x="240" y="552">0</text>
    <text x="405.5" y="552">2</text>
    <text x="570.9" y="552">4</text>
    <text x="736.4" y="552">6</text>
    <text x="901.8" y="552">8</text>
    <text x="1067.3" y="552">10 s</text>
  </g>

  <!-- row: E2E latency (top 110) -->
  <text x="222" y="128" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="end">E2E latency</text>
  <text x="222" y="148" font-size="13" fill="#52514e" text-anchor="end">speech end → answer</text>
  <path d="M240,110 h294.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-294.6 z" fill="#2a78d6"/>
  <path d="M240,134 h868 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-868 z" fill="#9ec5f4"/>
  <rect x="569.4" y="104" width="3" height="56" fill="#0b0b0b"/>
  <text x="582" y="125" font-size="15" fill="#0b0b0b">3.61</text>
  <text x="1120" y="149" font-size="15" fill="#0b0b0b">10.54</text>

  <!-- row: ASR final (top 196) -->
  <text x="222" y="214" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="end">ASR final</text>
  <text x="222" y="234" font-size="13" fill="#52514e" text-anchor="end">speech end → transcript</text>
  <path d="M240,196 h43.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-43.2 z" fill="#2a78d6"/>
  <path d="M240,220 h97.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-97.8 z" fill="#9ec5f4"/>
  <rect x="304.7" y="190" width="3" height="56" fill="#0b0b0b"/>
  <text x="318" y="211" font-size="15" fill="#0b0b0b">0.57</text>
  <text x="352" y="235" font-size="15" fill="#0b0b0b">1.23</text>

  <!-- row: LLM TTFT (top 282) -->
  <text x="222" y="300" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="end">LLM TTFT</text>
  <text x="222" y="320" font-size="13" fill="#52514e" text-anchor="end">transcript → first token</text>
  <path d="M240,282 h82.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-82.9 z" fill="#2a78d6"/>
  <path d="M240,306 h129.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-129.2 z" fill="#9ec5f4"/>
  <rect x="362.6" y="276" width="3" height="56" fill="#0b0b0b"/>
  <text x="376" y="297" font-size="15" fill="#0b0b0b">1.05</text>
  <text x="383" y="321" font-size="15" fill="#0b0b0b">1.61</text>

  <!-- row: TTS first audio (top 368) -->
  <text x="222" y="386" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="end">TTS TTFB</text>
  <text x="222" y="406" font-size="13" fill="#52514e" text-anchor="end">text → first audio</text>
  <path d="M240,368 h6.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-6.8 z" fill="#2a78d6"/>
  <path d="M240,392 h19.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-19.2 z" fill="#9ec5f4"/>
  <rect x="288.1" y="362" width="3" height="56" fill="#0b0b0b"/>
  <text x="301" y="383" font-size="15" fill="#0b0b0b">0.13</text>
  <text x="301" y="407" font-size="15" fill="#0b0b0b">0.28</text>

  <!-- row: Barge-in (top 454) -->
  <text x="222" y="472" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="end">Barge-in</text>
  <text x="222" y="492" font-size="13" fill="#52514e" text-anchor="end">speech → playback stopped</text>
  <path d="M240,454 h8.4 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-8.4 z" fill="#2a78d6"/>
  <path d="M240,478 h57.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-57.2 z" fill="#9ec5f4"/>
  <rect x="304.7" y="448" width="3" height="56" fill="#0b0b0b"/>
  <text x="318" y="469" font-size="15" fill="#0b0b0b">0.15</text>
  <text x="318" y="493" font-size="15" fill="#0b0b0b">0.74</text>

  <text x="40" y="584" font-size="13" fill="#898781">Targets: E2E 4 s · ASR 0.8 s · LLM 1.5 s · TTS 0.6 s · barge-in 0.8 s. E2E ends at her answer; fillers like "One moment" don't count.</text>
</svg>
